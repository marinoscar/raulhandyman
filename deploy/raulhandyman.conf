# =============================================================================
# raulhandyman.net — VPS Reverse Proxy Config
# =============================================================================
# Location on VPS: /opt/infra/proxy/nginx/conf.d/raulhandyman.conf
# Source of truth: repo/deploy/raulhandyman.conf (install.sh and deploy.sh copy it)
#
# - https://raulhandyman.net        → container on 127.0.0.1:8330
# - https://www.raulhandyman.net    → 301 to https://raulhandyman.net (one canonical URL)
# - http://  (both names)           → 301 to https://raulhandyman.net
# One certificate covers both names: /etc/letsencrypt/live/raulhandyman.net/
# =============================================================================

# Canonical site
server {
    listen 443 ssl http2;
    server_name raulhandyman.net;

    ssl_certificate     /etc/letsencrypt/live/raulhandyman.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raulhandyman.net/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    server_name www.raulhandyman.net;

    ssl_certificate     /etc/letsencrypt/live/raulhandyman.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raulhandyman.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://raulhandyman.net$request_uri;
}

# HTTP → HTTPS (both names)
server {
    listen 80;
    server_name raulhandyman.net www.raulhandyman.net;

    # ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://raulhandyman.net$request_uri;
    }
}
