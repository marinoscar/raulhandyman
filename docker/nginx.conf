# =============================================================================
# Container-internal nginx: serves the static Astro build on port 80.
# TLS, HSTS and the www redirect are handled by the VPS proxy (proxy-nginx).
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects issued here must stay relative so the public host/port is kept
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Health check for Docker and deploy scripts
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (CSS, fonts, images) never change: cache for a year
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed static files: cache for a day
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML: always revalidate so updates show up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
