# =============================================================================
# Container-internal nginx: serves the static Astro build on port 80.
# TLS, HSTS and the www redirect are handled by the VPS proxy (proxy-nginx).
#
# Compression choice (issue #37, option b): the stock nginx:1.27-alpine image
# has no ngx_brotli and the alpine module packages are not pinned to the
# image's nginx build, so this image ships gzip_static only. scripts/compress.mjs
# writes .gz (level 9) and .br (quality 11) next to every text asset; nginx
# serves the .gz here, and the .br files stay in the image for an outer proxy
# or a future brotli-enabled runtime image.
# =============================================================================

# Old slug -> new slug. Generated at build into dist/_redirects.map by
# scripts/compress.mjs from src/content/redirects.json. An empty file is valid.
map $uri $redirect_to {
    default "";
    include /usr/share/nginx/html/_redirects.map;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects issued here must stay relative so the public host/port is kept
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    etag on;

    # Compression: serve the precompressed .gz files; gzip on the fly only
    # as a fallback for files that have no precompressed sibling.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Moved pages keep their links and rankings
    if ($redirect_to) {
        return 301 $redirect_to;
    }

    # Health check for Docker and deploy scripts
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (CSS, fonts, images) never change: cache for a year
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Open Graph images and other unhashed images: one week
    location /og/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|avif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Other unhashed static files: one day
    location ~* \.(?:txt|xml|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML: short cache with background revalidation
    location / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
    }
}
