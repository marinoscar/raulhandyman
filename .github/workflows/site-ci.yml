name: Site CI

on:
  pull_request:
    paths-ignore:
      - 'admin/**'
      - '.github/workflows/admin-*.yml'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'admin/**'
      - '.github/workflows/admin-*.yml'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (fixture content)
        run: npm run build:prod
      - name: Dist checks
        run: npm run check
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
